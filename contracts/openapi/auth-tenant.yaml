openapi: 3.0.3
info:
  title: NebulaStack Auth & Tenant API
  version: 1.0.0
  description: Demo OIDC-like token issuance and tenant metadata (stub for Delivery 4).
servers:
  - url: http://localhost:8082
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /api/v1/auth/token:
    post:
      summary: Issue demo access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/tenants/me:
    get:
      summary: Current tenant from Bearer token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Unauthorized
  /api/v1/tenants/{tenant_id}:
    get:
      summary: Tenant by id
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    TokenRequest:
      type: object
      required: [grant_type, tenant_slug]
      properties:
        grant_type:
          type: string
          enum: [client_credentials, password]
        tenant_slug:
          type: string
          example: demo-salon
        client_id:
          type: string
          example: demo-client
        client_secret:
          type: string
        username:
          type: string
        password:
          type: string
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
    Tenant:
      type: object
      required: [id, slug, name, status, plan]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        plan:
          type: string
          enum: [STANDARD, ENTERPRISE]
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
