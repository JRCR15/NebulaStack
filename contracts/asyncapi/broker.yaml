asyncapi: 2.6.0
info:
  title: NebulaStack Event Bus
  version: 1.0.0
  description: CloudEvents over RabbitMQ (local) or SQS (AWS).
channels:
  nebulastack.scheduling.hold.created:
    publish:
      message:
        name: HoldCreated
        payload:
          $ref: "../cloudevents/nebula.scheduling.hold.created.json"
  nebulastack.payment.succeeded:
    publish:
      message:
        name: PaymentSucceeded
        payload:
          $ref: "../cloudevents/nebula.payment.succeeded.json"
  nebulastack.payment.failed:
    publish:
      message:
        name: PaymentFailed
        payload:
          $ref: "../cloudevents/nebula.payment.failed.json"
